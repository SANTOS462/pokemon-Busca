
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contato - Busca de Pokémon</title>
</head>

<body>

    <nav>
        
        <a href="inicio.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>


       
       

    <main class="pagina-contato">

        <h1>Entre em Contato</h1>


        <form id="formContato">

            <label for="nome">Seu nome:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">Seu e-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="mensagem">Mensagem:</label>
            <textarea
                id="mensagem"
                name="mensagem"
                rows="5"
                placeholder="Digite sua mensagem"
                required
            ></textarea>

            <button type="submit">Enviar mensagem</button>

            <p id="statusContato" role="status"></p>

        </form>

     

    </main>

    <footer class="rodape-pokemon">
        Tem alguma dúvida, sugestão ou ideia para o nosso
            projeto Busca de Pokémon? Envie uma mensagem!
        </p>



       

        <div class="container-redes">
            <a href="https://instagram.com"
               target="_blank" rel="noopener noreferrer">
                <img src="img\icons8-instagram-48.png">
            </a>

            <a href="https://youtube.com"
               target="_blank" rel="noopener noreferrer">
                <img src="img\icons8-youtube-48.png">
            </a>

            <a href="https://github.com/SANTOS462?tab=repositories"
               target="_blank" rel="noopener noreferrer">
                <img src="img\github.png" class="git1">


                
            </a>
        </div>
    </footer>

    <script>
        const form = document.getElementById("formContato");
        const status = document.getElementById("statusContato");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            status.textContent =
                "Mensagem preenchida! Para enviá-la de verdade, conecte um serviço de envio.";

            form.reset();
        });
    </script>

</body>
</html>
